name: Build Recorder

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Release
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Prepare single portable download
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path package | Out-Null
          # Keep the background beside Recorder.exe. This avoids asset-path problems
          # when the portable ZIP is extracted anywhere on Windows.
          $main = Get-Content src/main.cpp -Raw
          $main = $main.Replace('(std::filesystem::path(ModuleDir())/L"assets"/L"minecraft_bg.jpg").wstring()', '(std::filesystem::path(ModuleDir())/L"minecraft_bg.jpg").wstring()')
          Set-Content src/main.cpp $main -Encoding UTF8
          # Rebuild after the portable-path fix.
          cmake --build build --config Release --parallel
          Copy-Item build/Release/Recorder.exe package/Recorder.exe
          Copy-Item assets/minecraft_bg.jpg package/minecraft_bg.jpg
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extracted -Force
          $ffmpeg = Get-ChildItem ffmpeg-extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw 'Bundled FFmpeg executable was not found.' }
          Copy-Item $ffmpeg.FullName package/ffmpeg.exe
          $filters = & $ffmpeg.FullName -hide_banner -filters 2>&1 | Out-String
          if ($filters -notmatch 'gfxcapture') { throw 'Bundled FFmpeg does not contain gfxcapture. FFmpeg 8.1+ is required.' }
          $encoders = & $ffmpeg.FullName -hide_banner -encoders 2>&1 | Out-String
          if ($encoders -notmatch 'h264_qsv') { Write-Warning 'FFmpeg build does not list h264_qsv.' }
          @"
          Recorder portable package
          Keep Recorder.exe, ffmpeg.exe and minecraft_bg.jpg together.
          Start Minecraft, open Recorder, then press F8.
          Default: low-end 720p at 30 FPS.
          Recordings: Documents\Recorder
          Capture: Windows Graphics Capture + Intel Quick Sync
          "@ | Set-Content package/README.txt
          Compress-Archive -Path package/* -DestinationPath Recorder-windows-x64.zip -Force

      - name: Upload one download
        uses: actions/upload-artifact@v4
        with:
          name: Recorder-windows-x64
          path: Recorder-windows-x64.zip
          if-no-files-found: error
