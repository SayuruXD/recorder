name: Build Recorder

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Release
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Prepare portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/Recorder.exe package/Recorder.exe

          # Use the current Windows essentials build and verify the exact executable.
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extracted -Force
          $ffmpeg = Get-ChildItem ffmpeg-extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw 'FFmpeg executable was not found in downloaded archive.' }
          Copy-Item $ffmpeg.FullName package/ffmpeg.exe

          # Fail the CI job if the downloaded FFmpeg cannot provide the capture/encoder
          # features the recorder relies on. This prevents a broken artifact from reaching you.
          $features = & $ffmpeg.FullName -hide_banner -filters 2>&1 | Out-String
          if ($features -notmatch 'ddagrab') { throw 'Bundled FFmpeg does not contain ddagrab.' }
          $encoders = & $ffmpeg.FullName -hide_banner -encoders 2>&1 | Out-String
          if ($encoders -notmatch 'h264_qsv') { Write-Warning 'Bundled FFmpeg does not list h264_qsv; CPU fallback remains available.' }

          @"
          Recorder portable build

          Keep Recorder.exe and ffmpeg.exe in the same folder.
          Start Recorder, launch Minecraft, then press F8.
          Default profile: 1280x720, 30 FPS, Intel Quick Sync preferred.
          Recordings are saved to Documents\\Recorder.
          "@ | Set-Content package/README.txt

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Recorder-windows-x64-portable
          path: package
